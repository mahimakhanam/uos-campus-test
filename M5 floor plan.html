<!DOCTYPE html>
<html>
<head>
<title>M5 floor plan</title>
<link rel="stylesheet" type="text/css" href="M5 floor plan.css">
<script src="M5 floor plan.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="container">
	<object id="M5_floor_1_svg" data="M5_floor1.svg?v=" type="image/svg+xml"></object>
	<object id="M5_floor_2_svg" data="M5_floor2.svg?v=" type="image/svg+xml"></object>
	<div id="floor_switcher">
		<button id="first" type="button">First</button>
		<button id="second" type="button">Second</button>
	</div>
	<div id="detail_container">
		<button id="close" type="button">X</button>
		<div id="details">
			<h2>Room details</h2>
			<p><strong>Building number:</strong> <span id="building-no"></span></p>
			<p><strong>Room number:</strong> <span id="room-no"></span></p>
			<p><strong>Room occupant:</strong> <span id="prof-name"></span></p>
			<p><strong>Contact:</strong> <span id="prof-email"></span></p>
		</div>
	</div>
</div>
</body>
</html>
