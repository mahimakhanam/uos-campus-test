
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UoS Campus Map Editor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6fa;
        }

        h1 {
            color: #17355e;
        }

        .toolbar {
            background-color: white;
            padding: 15px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .active {
            background-color: #b8f5cf;
        }

        .delete-active {
            background-color: #ffb3b3;
        }

        .mapContainer {
            width: 100%;
            height: 850px;
            border: 2px solid #17355e;
            background-color: white;
            overflow: hidden;
        }

        #campusMap {
            width: 100%;
            height: 100%;
            display: block;
        }

        #status {
            color: #17355e;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>UoS Campus Map Editor</h1>

    <div class="toolbar">

        <button id="addNode">Add Node</button>
        <button id="connectNodes">Connect Nodes</button>
        <button id="deleteNode">Delete Node</button>
        <button id="deleteConnection">Delete Connection</button>

        <button id="assignBuilding">Assign Building</button>

        <button id="undoButton" disabled>Undo</button>

        <button id="saveGraph">Save Graph</button>
        <button id="loadGraph">Load Graph</button>

        <input
            type="file"
            id="graphFile"
            accept=".json,application/json"
            style="display:none"
        >

        <button id="zoomIn">Zoom In +</button>
        <button id="zoomOut">Zoom Out -</button>
        <button id="resetZoom">Reset Zoom</button>

        <p id="status">Map editor ready.</p>

    </div>

    <div class="mapContainer">
        <object
            id="campusMap"
            type="image/svg+xml"
            data="images/campus-map.svg">
        </object>
    </div>

    <script src="editor.js"></script>

</body>
</html>
